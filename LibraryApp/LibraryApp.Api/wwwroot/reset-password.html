<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - O Caminho do Saber</title>
    <link rel="stylesheet" type="text/css" href="index.css">
    <style>
        .reset-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <!-- Página aberta pelo link do e-mail de redefinição de senha (?email=...&token=...) -->
    <div class="reset-page">
        <div class="modal-content">
            <h2>Criar Nova Senha</h2>

            <div id="resetFormSection">
                <p style="color:#666; margin-bottom:20px;">Conta: <strong id="resetEmail"></strong></p>
                <form onsubmit="resetPassword(event)">
                    <div class="form-group">
                        <label>Nova senha</label>
                        <input type="password" id="newPassword" required minlength="8" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label>Confirmar nova senha</label>
                        <input type="password" id="confirmNewPassword" required minlength="8" autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn-primary" id="resetBtn">Salvar Nova Senha</button>
                </form>
            </div>

            <div id="invalidLinkSection" style="display:none;">
                <p style="color:#666;">Este link de redefinição é inválido. Peça um novo link na tela de login.</p>
            </div>

            <div class="modal-link">
                <a href="index.html">← Voltar para a biblioteca</a>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="api-integration.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const email = params.get('email');
        const token = params.get('token');

        if (email && token) {
            document.getElementById('resetEmail').textContent = email;
        } else {
            document.getElementById('resetFormSection').style.display = 'none';
            document.getElementById('invalidLinkSection').style.display = 'block';
        }

        async function resetPassword(event) {
            event.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;

            if (newPassword !== confirmNewPassword) {
                showNotification('As senhas não coincidem.', 'error');
                return;
            }

            const btn = document.getElementById('resetBtn');
            btn.disabled = true;
            btn.textContent = 'Salvando...';

            const result = await AuthService.resetPassword(email, token, newPassword);

            if (result.success) {
                // A redefinição encerra as sessões abertas: limpa os dados locais para forçar um novo login
                TokenManager.clearTokens();
                TokenManager.clearUserData();
                showNotification('Senha redefinida! Faça login com a nova senha.', 'success');
                setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                return;
            }

            showNotification(result.error || 'Erro ao redefinir a senha', 'error');
            btn.disabled = false;
            btn.textContent = 'Salvar Nova Senha';
        }

        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;

            setTimeout(() => {
                notification.classList.remove('show');
            }, 4000);
        }
    </script>
</body>
</html>
